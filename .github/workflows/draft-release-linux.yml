name: Draft Release Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  draft-releases:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libarchive-tools libopenjp2-tools rpm
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-deps
      # Publish to whichever repo the workflow runs in (upstream or a fork),
      # instead of the hardcoded target in package.json's "repository" field.
      # releaseType=release publishes immediately; electron-builder otherwise
      # defaults to a draft that has to be published by hand.
      - run: >-
          pnpm release:linux
          -c.publish.provider=github
          -c.publish.owner=${{ github.repository_owner }}
          -c.publish.repo=${{ github.event.repository.name }}
          -c.publish.releaseType=release
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
